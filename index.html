<!DOCTYPE html>
<html lang="en">

<!--
═══════════════════════════════════════════════════════════════════════════════
  reporting_for_duty — 「奴隶上门」召唤按钮页
═══════════════════════════════════════════════════════════════════════════════

  【最终页面长什么样】
  一个满屏居中的页面，只有两样东西：

    ┌───────────────────────────────────┐
    │                                   │
    │           ╭─────────╮             │  ← ① 大圆形按钮
    │          │   召唤    │            │     160×160，橙红渐变
    │          │   仆人    │            │     点击 → 跳转 dongs.tech
    │           ╰─────────╯             │
    │                                   │
    │           Tap to Call             │  ← ② 状态提示文字（灰色小字）
    │                                   │
    └───────────────────────────────────┘

  【打开页面时的自动行为】
    页面加载 1 秒后，自动向系统发起拨号请求 tel:18602152036
      ├── 用户点「确认」→ 直接拨号
      └── 用户点「取消」→ 留在本页 → 可点击按钮跳转 dongs.tech

    ⚠️ 注意：部分浏览器（尤其 iOS Safari / Android Chrome）
       会拦截「非用户手势触发」的 tel: 导航 —— 这是浏览器安全策略，
       不是代码问题，无法绕过。若自动拨号未弹出，属正常现象。

  【本文件结构导航】
    <head>        元信息         页面标题 / 图标 / PWA 相关
    <style>       样式           按钮和文字的视觉
    <body>        页面内容       按钮 + 状态文字
    <script>      交互逻辑       自动拨号 + 点击跳转

  【改完怎么发布】
    cd ~/Desktop/reporting_for_duty && git add -A && git commit -m "说明" && git push
═══════════════════════════════════════════════════════════════════════════════
-->

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- ▲ viewport：让手机按设备宽度排版；
       user-scalable=no → 禁止双指缩放（App 化体验，避免误缩放）-->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- ▲ iOS 专属：允许「添加到主屏幕」后以全屏 App 形式打开（隐藏 Safari 地址栏）-->

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- ▲ iOS 专属：全屏模式时顶部状态栏样式。default = 白底黑字 -->

  <link rel="apple-touch-icon" href="icon.png">
  <!-- ▲ iOS 专属：添加到主屏幕时用的图标（iOS 自动裁圆角）-->

  <title>Reporting for Duty</title>
  <!-- ▲ 浏览器标签页标题。添加为 App 后显示的是 manifest.json 里的「奴隶上门」-->

  <style>
    /* ═══════════════════════════════════════════════════════════════
       全局重置 + 页面基础布局
       ═══════════════════════════════════════════════════════════════ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;   /* 让 padding/border 算进宽高 */
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;  /* ← 垂直居中 */
      align-items: center;      /* ← 水平居中 */
      height: 100vh;
      height: 100dvh;           /* ← 动态视口高度：手机地址栏收起/展开时更准确
                                     （支持它的浏览器会用这行覆盖上一行）*/
      background-color: #f5f5f7;/* ← 页面背景（苹果风格浅灰）*/
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;  /* ← 去掉移动端点击的灰色高亮块 */
      user-select: none;                          /* ← 禁止选中文字（App 化体验）*/
      -webkit-user-select: none;
    }

    /* ─────────────────────────────────────────────
       【① 大圆形按钮】屏幕正中的 160×160 圆形
       屏幕上显示：「召唤」（大字）+「仆人」（小字）
       行为：点击 → 跳转 dongs.tech（见底部 <script>）
       ───────────────────────────────────────────── */
    .call-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;                                     /* ← 50% 让它变正圆 */
      border: none;
      background: linear-gradient(135deg, #ff5e62, #ff9966);  /* ← 135° 对角渐变：橙红→橙 */
      color: white;
      font-size: 18px;                                        /* ← 主文字「召唤」字号 */
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 94, 98, 0.4);          /* ← 橙红投影，营造悬浮感 */
      transition: transform .1s, opacity .2s;                 /* ← 按下动画时长 */
    }

    .call-btn:active {
      transform: scale(.95);   /* ← 【按下效果】缩小到 95%，像被按下去 */
      opacity: .9;
    }

    /* ─────────────────────────────────────────────
       【② 状态提示文字】按钮下方那行灰色小字
       初始显示 "Tap to Call"，点击按钮后变为 "Going..."
       ───────────────────────────────────────────── */
    .status {
      margin-top: 24px;
      color: #86868b;          /* ← 灰色（次要信息）*/
      font-size: 14px;
      letter-spacing: 1px;     /* ← 字间距拉开，更透气 */
    }
  </style>
</head>

<body>
  <!-- ═══════════════════════════════════════════════════════════════
       页面内容：只有两样 —— 按钮 + 状态文字
       ═══════════════════════════════════════════════════════════════ -->

  <!-- 【① 主按钮】
       id="actionBtn" 是给下面 JavaScript 绑定点击事件的钩子。
       ⚠️ 若改动 id，需同步改 <script> 里的 getElementById("actionBtn") -->
  <button class="call-btn" id="actionBtn">
    <div>仆人</div>
    <!-- 副标题：内联样式让它比主文字小一号，并与主文字拉开间距 -->
    <div style="font-size:14px;font-weight:normal;margin-top:4px">详情</div>
  </button>

  <!-- 【② 状态提示】
       id="statusText" 也是 JS 钩子：点击按钮后这里会变成 "Going..." -->
  <div class="status" id="statusText">Tap to Call</div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       【交互逻辑】共两件事，互相独立

       ⚠️ 为什么要拆成两件独立的事：
          浏览器里 window.location.href 同一时刻只能去一个地址。
          若「点击按钮」既拨号又跳转，两次赋值会互相覆盖（竞争条件），
          结果不可预测。所以这里拆开：
            - 自动拨号 → 只在页面加载时做一次
            - 点击按钮 → 只做跳转
       ═══════════════════════════════════════════════════════════════ */

    /* ─────────────────────────────────────────────
       ① 页面加载 1 秒后，自动发起拨号请求
       屏幕效果：手机上弹出系统拨号确认界面
       ⚠️ 浏览器限制：非用户手势触发的 tel: 导航
          在部分浏览器会被拦截（iOS Safari / Android Chrome）。
          这是浏览器安全策略，无法用代码绕过。
       ───────────────────────────────────────────── */
    setTimeout(function () {
      window.location.href = "tel:18602152036";
    }, 1000);

    /* ─────────────────────────────────────────────
       ② 点击按钮 → 跳转 dongs.tech
       屏幕效果：提示文字变为 "Going..."，随即跳转
       ⚠️ 注意：这里【不再拨号】。拨号只由上面 ① 负责。
       ───────────────────────────────────────────── */
    document.getElementById("actionBtn").addEventListener("click", function () {
      document.getElementById("statusText").innerText = "Going...";
      window.location.href = "https://dongs.tech";
    });
  </script>
</body>

</html>

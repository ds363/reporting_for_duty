<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon.png"><title>Reporting for Duty</title><style>*{margin:0;padding:0;box-sizing:border-box}body{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;height:100dvh;background-color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}.call-btn{width:160px;height:160px;border-radius:50%;border:none;background:linear-gradient(135deg,#ff5e62,#ff9966);color:white;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 8px 24px rgba(255,94,98,0.4);transition:transform .1s,opacity .2s}.call-btn:active{transform:scale(.95);opacity:.9}.status{margin-top:24px;color:#86868b;font-size:14px;letter-spacing:1px}</style></head><body><button class="call-btn" id="actionBtn"><div>召唤</div><div style="font-size:14px;font-weight:normal;margin-top:4px">仆人</div></button><div class="status" id="statusText">Tap to Call</div><script>document.getElementById("actionBtn").addEventListener("click",function(){document.getElementById("statusText").innerText="Calling...",window.location.href="tel:18602152036"});setTimeout(function(){window.location.href="tel:18602152036"},1000)</script></body></html>
